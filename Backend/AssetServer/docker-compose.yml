version: '3.8'

services:

  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: assetdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Możesz odkomentować poniższą linię jeśli chcesz inicjalizować bazę z SQL:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API MinIO
      - "9001:9001"  # MinIO console
    volumes:
      - minio_data:/data

  backend:
    build: .
    command: bash -c "dotnet ef database update --no-build && dotnet AssetServer.dll"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=database;Database=assetdb;Username=myuser;Password=mypassword
      MinIO__ServiceURL: http://minio:9000
      MinIO__AccessKey: minioadmin
      MinIO__SecretKey: minioadmin
      MinIO__BucketName: assets
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5190:5190"
      - "5189:5189"

  #frontend:
  #  build:
  #    context: ../../Frontend/AssetServer
  #  ports:
  #    - "8000:8000"
  #  volumes:
  #    - ../../Frontend/AssetServer:/app
  #  environment:
  #    BACKEND_URL: http://backend:5190
  #  depends_on:
  #    - backend
  frontend:
    build:
      context: ../../Frontend/AssetServerReact
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ../../Frontend/AssetServerReact:/app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://backend:5190
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:

